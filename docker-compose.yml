services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agent-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
